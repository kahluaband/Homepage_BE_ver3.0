name: CD

on:
  push:
    branches:
      - chore/16-cicd-refactor

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Test and build JAR
        run: ./gradlew --no-daemon --console=plain clean test bootJar

      - name: Verify packaged Spring configuration
        shell: bash
        run: |
          for file in application.yml application-prod.yml; do
            unzip -p build/libs/*.jar "BOOT-INF/classes/$file" |
              cmp - "src/main/resources/$file" > /dev/null
          done

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: seungwon326/kahlua-backend:${{ github.sha }}